[project]
name = "clause-graph"
version = "0.1.0"
description = "GraphRAG for contracts: Neo4j knowledge graph of clauses, defined terms and cross-references."
readme = "CLAUDE.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.117",
    "mcp>=2.3,<3",
    "neo4j>=5.20",
    "pydantic>=2",
    "python-dotenv",
    "tokenizers>=0.20,<1",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clause_graph"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

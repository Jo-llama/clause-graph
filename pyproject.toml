[project]
name = "clause-graph"
version = "0.1.0"
description = "GraphRAG for contracts: Neo4j knowledge graph of clauses, defined terms and cross-references."
readme = "CLAUDE.md"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.20",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clause_graph"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
